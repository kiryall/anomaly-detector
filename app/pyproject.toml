[project]
name = "anomaly-detector"
version = "0.1.0"
description = "Anomaly detection MVP"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.15.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.4",
    "onnxruntime>=1.20.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ultralytics>=8.4.117",
]
